---
- hosts: 172.31.21.249
  become: yes
  tasks:
    - include_tasks: myfile.yml
    - name: install webserver
      ansible.builtin.dnf:
        name: httpd
        state: present
        update_cache: yes
    - name: i want to create a folder
      file:
        state: directory
        path: /home/maha/myfolder
    - name: copy my static file into node side
      copy:
        src: mystaticfile
        dest: /home/maha/myfolder
    - name: copy myindex.j2 file into nodes
      template:
          src: myindex.j2
          dest: /var/www/html/index.html