---
- name: set chown  -r mode on tomcat folder 
  ansible.builtin.file:
    path: /opt/tomcat/apache-tomcat-10.1.59
    owner: tomcat
    group: "{{mytomcatgroup}}"
    state: directory
    recurse: yes


- name: set chown +x on tomcat bin folder
  ansible.builtin.file:
    path: /opt/tomcat/apache-tomcat-10.1.59/bin
    owner: tomcat
    group: "{{mytomcatgroup}}"
    mode: '0755'
    state: directory
    recurse: yes

